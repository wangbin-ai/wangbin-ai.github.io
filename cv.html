    <link rel="stylesheet" href="assets/css/main.css">

<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <!-- Populated by JavaScript -->
            </a>
            <div class="nav-overlay" id="navOverlay"></div>
            <div class="nav-menu" id="navMenu">
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#experience" class="nav-link">Experience</a>
                <a href="index.html#research" class="nav-link">Research</a>
                <a href="index.html#publications" class="nav-link">Publications</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>

    <!-- CV Sidebar Navigation -->
    <nav class="cv-sidebar-nav" id="cvSidebarNav">
        <!-- Populated by JavaScript -->
    </nav>

    <!-- CV Content -->
    <main class="cv-page">
        <!-- Header -->
        <div class="cv-header">
            <h1 class="cv-name" id="cvName"><!-- Populated by JavaScript --></h1>
            <p class="cv-title" id="cvTitle"><!-- Populated by JavaScript --></p>
            <div class="cv-contact-row" id="cvContactRow">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Actions -->
        <div class="cv-actions">
            <a href="index.html" class="btn-cv btn-cv-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Home
            </a>
            <button onclick="window.print()" class="btn-cv btn-cv-print">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
                Print / Save PDF
            </button>
        </div>

        <!-- Research Interests -->
        <div class="cv-section" id="cv-research-interests">
            <div id="cvResearchInterests"><!-- Populated by JavaScript --></div>
        </div>

        <!-- Experience -->
        <div class="cv-section" id="cv-experience">
            <div id="cvExperience"><!-- Populated by JavaScript --></div>
        </div>

        <!-- Education -->
        <div class="cv-section" id="cv-education">
            <div id="cvEducation"><!-- Populated by JavaScript --></div>
        </div>

        <!-- Selected Publications -->
        <div class="cv-section" id="cv-publications">
            <div id="cvPublications"><!-- Populated by JavaScript --></div>
        </div>

        <!-- Awards & Honors -->
        <div class="cv-section" id="cv-awards">
            <div id="cvAwards"><!-- Populated by JavaScript --></div>
        </div>

        <!-- Professional Services -->
        <div class="cv-section" id="cv-services">
            <div id="cvServices"><!-- Populated by JavaScript --></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer cv-footer">
        <div class="footer-container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p id="footerCopyright"></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
